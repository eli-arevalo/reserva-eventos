name: CI - reservaEventos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Permisos Maven Wrapper
        run: chmod +x mvnw

      - name: Generar JAR
        run: ./mvnw -B package -DskipTests

      - name: Construir imagen Docker
        run: docker build -t reservaeventos:ci .